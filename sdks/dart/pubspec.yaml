name: cheki
description: >
  A Dart client for the cheki API, a free Ethiopian receipt verification service.
  Verify bank transfer receipts from CBE, Telebirr, BOA, M-Pesa, Dashen, Awash, Siinqee, eBirr, and ZamZam.
version: 1.4.1
homepage: https://cheki.et
documentation: https://cheki.et/docs
repository: https://github.com/1RB/cheki
issue_tracker: https://github.com/1RB/cheki/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0
  http_parser: ^4.0.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

topics:
  - api
  - http
  - receipt
  - verification
  - ethiopia
  - cbe
  - telebirr
  - m-pesa
  - dashen
  - awash
  - zemen
  - eBirr
