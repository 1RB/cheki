name: Publish SDKs

# Runs only when a release tag is pushed. Every step fails loudly: a failed
# build, test or upload fails the job instead of being skipped.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Committed build output matches src
        run: git diff --exit-code -- index.js index.d.ts
      - name: Publish (skipped only when this exact version is already on npm)
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "cheki-verify@${VERSION}" version >/dev/null 2>&1; then
            echo "cheki-verify@${VERSION} is already published, skipping."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@1rb'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Publish (skipped only when this exact version already exists)
        run: |
          # GitHub Packages needs a scoped name, and npm scopes are lowercase.
          node -e "const p=require('./package.json'); p.name='@1rb/cheki-verify'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "@1rb/cheki-verify@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@1rb/cheki-verify@${VERSION} already exists, skipping."
            exit 0
          fi
          npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]" build twine
      - run: pytest -q
      - run: python -m build
      - run: twine check dist/*
      - run: twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  publish-packagist:
    name: Publish to Packagist
    runs-on: ubuntu-latest
    steps:
      - name: Update Packagist
        run: |
          # Token in a header, not the query string; --fail-with-body makes an
          # error response fail the job.
          curl --fail-with-body -sS -X POST "https://packagist.org/api/update-package" \
            -H "Authorization: Bearer 1rb:${PACKAGIST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"repository":"https://github.com/1RB/cheki"}'
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
