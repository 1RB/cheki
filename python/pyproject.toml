[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cheki"
version = "1.5.0"
description = "Python client for the cheki API: free, open-source Ethiopian bank/wallet receipt verification (CBE, Telebirr, BOA, M-Pesa, Dashen, Awash, Siinqee, eBirr, ZamZam, CBE Birr)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "1RB", email = "contact@1rb.dev"}
]
keywords = ["ethiopia", "receipt", "verification", "cbe", "telebirr", "bank", "m-pesa", "dashen", "awash", "zemen", "eBirr", "zamzam", "cbebirr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The API client (ChekiClient, the CLI) needs only requests. Floors skip
# releases with published advisories (requests < 2.33.0, urllib3 < 2.8.0).
dependencies = [
    "requests>=2.33.0",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
# Deprecated direct mode (cheki.verify, cheki-verify --direct) parses bank
# HTML and PDFs itself. pdfminer.six < 20251230 has published advisories.
direct = [
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.11.9",
    "pdfminer.six>=20251230",
]
dev = [
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.11.9",
    "pdfminer.six>=20251230",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "reportlab>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
cheki-verify = "cheki.cli:main"

[project.urls]
Homepage = "https://cheki.et"
Documentation = "https://cheki.et/docs"
Repository = "https://github.com/1RB/cheki"
Issues = "https://github.com/1RB/cheki/issues"

[tool.hatch.build.targets.wheel]
packages = ["cheki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Errors and likely bugs only; style is not enforced on the legacy parsers.
select = ["E9", "F", "B"]
ignore = ["B904"]

[tool.mypy]
python_version = "3.10"
# The API client is typed and checked; the deprecated direct parsers are not.
files = ["cheki/client.py", "cheki/client_types.py", "cheki/registry.py", "cheki/_version.py"]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
