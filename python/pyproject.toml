[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cheki"
version = "1.4.1"
description = "Python client for the cheki API: free, open-source Ethiopian bank/wallet receipt verification (CBE, Telebirr, BOA, M-Pesa, Dashen, Awash, Siinqee, eBirr, ZamZam)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "1RB", email = "contact@1rb.dev"}
]
keywords = ["ethiopia", "receipt", "verification", "cbe", "telebirr", "bank", "m-pesa", "dashen", "awash", "zemen", "eBirr", "zamzam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pdfplumber>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "reportlab>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
cheki-verify = "cheki.cli:main"

[project.urls]
Homepage = "https://github.com/1RB/cheki"
Repository = "https://github.com/1RB/cheki"
Issues = "https://github.com/1RB/cheki/issues"

[tool.hatch.build.targets.wheel]
packages = ["cheki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Errors and likely bugs only; style is not enforced on the legacy parsers.
select = ["E9", "F", "B"]
ignore = ["B904"]

[tool.mypy]
python_version = "3.10"
# The API client is typed and checked; the deprecated direct parsers are not.
files = ["cheki/client.py", "cheki/client_types.py", "cheki/registry.py", "cheki/_version.py"]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
